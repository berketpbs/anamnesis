# Anamnesis project marker.
#
# Its presence pins the memory scope for this directory and everything below
# it. Without it, the project identity is derived from the git remote.

[scope]
workspace = "default"
project = "anamnesis"

[capture]
# Glob patterns whose file events are dropped before anything is recorded.
#
# Gitignore-shaped: a pattern with no slash matches at any depth, and one
# ending in a slash covers the directory. Matching is case-insensitive.
# This is a second line of defence, not the first: redaction runs on every
# observation regardless, because a secret pasted into a prompt has no path
# to exclude.
ignore_paths = ["target/**", "Cargo.lock"]

# What `anamnesis sweep` forgets, and how quickly. Read by the sweep; nothing
# runs on a schedule, so pages go only when the command is run.
#
# Half-lives, not rates: under the defaults an unread page keeps half its
# weight after 30 days and crosses the threshold after roughly four months,
# while being retrieved renews it. Pinned, `semantic`/`procedural`, canonical,
# and `do-not-answer-from` pages are never swept at any setting.
[decay]
threshold = 0.05
age_half_life_days = 30.0
access_half_life_days = 14.0
access_weight = 0.5

[slots]
# Per-operator memory slots, for shared servers. Parsed; not implemented.
per_user = false

# Parsed; nothing runs on a schedule yet.
[auto_improve]
enabled = true
require_approval = true

# A single table, not a list. `[[auto_improve.scheduler]]` would declare an
# array of tables and the schedule would be silently ignored.
[auto_improve.scheduler]
enabled = false
interval_minutes = 60
