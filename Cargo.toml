[workspace]
resolver = "3"
members = [
    "crates/anamnesis-core",
    "crates/anamnesis-store",
    "crates/anamnesis-wiki",
    "crates/anamnesis-mcp",
    "crates/anamnesis-hooks",
    "crates/anamnesis-llm",
    "crates/anamnesis-consolidate",
    "crates/anamnesis-web",
    "crates/anamnesis-cli",
    "crates/anamnesis-evals",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/berketpbs/anamnesis"
authors = ["Berke Topbas <berketopbas126@gmail.com>"]

[workspace.dependencies]
# Inter-crate dependencies.
anamnesis-core = { path = "crates/anamnesis-core", version = "1.1.0" }
anamnesis-store = { path = "crates/anamnesis-store", version = "1.1.0" }
anamnesis-wiki = { path = "crates/anamnesis-wiki", version = "1.1.0" }
anamnesis-mcp = { path = "crates/anamnesis-mcp", version = "1.1.0" }
anamnesis-hooks = { path = "crates/anamnesis-hooks", version = "1.1.0" }
anamnesis-llm = { path = "crates/anamnesis-llm", version = "1.1.0" }
anamnesis-consolidate = { path = "crates/anamnesis-consolidate", version = "1.1.0" }
anamnesis-web = { path = "crates/anamnesis-web", version = "1.1.0" }
anamnesis-evals = { path = "crates/anamnesis-evals", version = "1.1.0" }

# Error handling.
anyhow = "1"
thiserror = "2"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# Logging / tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Time & IDs.
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

# Config & CLI.
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "5"
toml_edit = "0.22"

# Secrets + constant-time / RNG primitives for bearer-token auth.
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
getrandom = "0.3"
base64 = "0.22"
# The operating system's credential store, for model keys a server started at
# login has to find: Credential Manager on Windows, the Keychain on macOS. No
# default features — each target turns on its own store, and Linux turns on
# none (see anamnesis-cli's manifest).
keyring = { version = "3.6", default-features = false }
# A key typed at a terminal without being echoed to it.
rpassword = "7"

# Storage.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
refinery = { version = "0.8", features = ["rusqlite"] }
sha2 = "0.10"
parking_lot = "0.12"

# Filesystem watcher + process inspection.
notify = "8"
notify-debouncer-full = "0.6"
sysinfo = "0.32"
fs2 = "0.4"

# Windows NTFS file-index (inode equivalent) for own-write detection.
winapi-util = "0.1"

# MCP server SDK.
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Backup / restore archive format.
tar = "0.4"
flate2 = "1"

# Markdown rendering for the wiki browser. Raw HTML in a page is shown as
# text rather than passed through: pages are written by models and by capture,
# so the body is untrusted input that happens to live on disk.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Text munging / hook payload sanitisation.
regex = "1"

# Capture exclusions: gitignore-style glob matching for `[capture] ignore_paths`.
globset = "0.4"

# Wiki git versioning.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# LLM provider HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-trait = "0.1"

# Local text embeddings (vector-cosine retrieval stream). CPU-only: no CUDA
# feature, so no GPU toolchain is required to build or run anamnesis.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Testing.
tempfile = "3"
# Properties rather than examples, for the functions whose inputs arrive from
# outside: paths an agent names, text a hook captures, queries somebody types.
# Default features minus the fork/timeout machinery, which nothing here uses.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The dev profile is tuned for how big `target/` gets, because on this project
# that has been the problem twice: 40 GB on 2026-08-30, and 27.6 GB on
# 2026-09-12 with the dependency setting below already in place. The second
# time, 17.7 GB of it was `target/debug/incremental` — 365 cache directories,
# 48 of them for `anamnesis-core` alone. Rustc keeps one per distinct build of a
# crate (check, clippy, test, one per feature set a `-p` selection unifies to,
# one per dependency bump) and nothing ever removes one that stops being used.
#
# Measured from clean on 2026-09-12, as `cargo test --workspace --no-run`, then
# `cargo clippy --workspace --all-targets`, then one edit to
# `anamnesis-store/src/query.rs` and the test build again:
#
#                                      test build     +clippy   after one edit
#   debug = true, incremental           77 s 2.92 GB  3.35 GB   9 s  4.09 GB
#   debug = "line-tables-only"          72 s 2.18 GB  2.61 GB   8 s  2.98 GB
#   line-tables-only, no incremental    66 s 1.67 GB  1.88 GB  11 s  1.88 GB
#
# The last row is what ships. One edit grew the first tree by 0.74 GB and the
# last by nothing, and the clean build is faster, not slower. What it costs is
# about three seconds on a rebuild after touching a crate most of the workspace
# depends on. If that ever matters more than the disk, `incremental = true` is
# the one line to change back — and `cargo sweep` (see the note below) is then
# what keeps the directory from growing without end.
#
# `line-tables-only` keeps what a backtrace needs, a file and a line for every
# frame of this repository's code. What it drops is variable inspection in a
# debugger, which is not how anything here has been debugged.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false

# Dependencies build without debug info, which this project's own crates keep.
# Measured on a clean build: `target/debug/deps` was 3.3 GB of a 4.2 GB tree,
# and almost all of it is debug info for crates nobody steps through — candle,
# tokenizers, rmcp, reqwest, axum, git2. Left alone it is worse than it looks,
# because cargo never collects the artifacts a changed dependency version
# leaves behind: the same tree had grown to 7.2 GB, and to 40 GB before that.
#
# `"*"` reaches dependencies and not workspace members, so stepping through
# this repository's code still works and its frames in a backtrace still carry
# a file and a line. What is given up is inspecting a variable inside a
# dependency, which is not how anything here has ever been debugged. CI gets
# it too: every job saves and restores this tree through `rust-cache`.
#
# Neither setting removes artifacts a dependency bump leaves behind in
# `target/debug/deps`. `cargo install cargo-sweep`, then `cargo sweep --time 14`
# from the repository root, does.
[profile.dev.package."*"]
debug = false
