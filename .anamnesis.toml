# Anamnesis project marker.
#
# Its presence pins the memory scope for this directory and everything below
# it. Without it, the project identity is derived from the git remote.

[scope]
workspace = "default"
project = "anamnesis"

[capture]
# Glob patterns whose file events are dropped before anything is recorded.
#
# Gitignore-shaped: a pattern with no slash matches at any depth, and one
# ending in a slash covers the directory. Matching is case-insensitive.
# This is a second line of defence, not the first: redaction runs on every
# observation regardless, because a secret pasted into a prompt has no path
# to exclude.
ignore_paths = ["target/**", "Cargo.lock"]

# What `anamnesis sweep` forgets, and how quickly. Read by the sweep; nothing
# runs on a schedule, so pages go only when the command is run.
#
# Half-lives, not rates: under the defaults an unread page keeps half its
# weight after 30 days and crosses the threshold after roughly four months,
# while being retrieved renews it. Pinned, `semantic`/`procedural`, canonical,
# and `do-not-answer-from` pages are never swept at any setting.
[decay]
threshold = 0.05
age_half_life_days = 30.0
access_half_life_days = 14.0
access_weight = 0.5

# What happens to a session the harness never closed.
#
# Consolidation is driven by `SessionEnd`, and that event is not guaranteed:
# an editor that crashes, a machine that reboots, a process someone kills
# sends nothing. Left alone the session stays open forever and its
# observations never become a page — the transcript under `raw/` survives,
# but nothing ever reads it again.
#
# The server sweeps for these once a minute and summarises the ones that have
# been silent this long. The number is hours rather than minutes on purpose: a
# session that died and a session whose operator went to lunch look identical
# from here, and being early is the mistake with a cost. Being wrong is
# survivable either way — an agent that comes back has its session reopened,
# and ending it again rewrites the same page.
#
# Zero turns the sweep off for this project.
[sessions]
stale_after_minutes = 720

# Per-operator handoff slots, for a server more than one person uses.
#
# Left false, a project keeps one pending handoff and whoever starts next is
# handed it — right on one person's machine, and a silent theft on a shared
# one. Set it true and the note a session leaves waits for the operator whose
# token that session arrived under; everyone the server cannot name goes on
# sharing the one slot they always shared.
[slots]
per_user = false

# What `anamnesis improve` — and, when scheduled, the server — may do to this
# project's memory.
#
# `require_approval` is the important one: left true, a pass files proposals
# and stops, and every change is made by someone running
# `anamnesis improve --apply <id>`. Set it false and the pass carries out the
# proposals it can carry out mechanically, which today means promoting a page
# several sessions kept coming back to into the durable tier — where the decay
# sweep can no longer reach it.
[auto_improve]
enabled = true
require_approval = true

# Off by default: nothing runs on a schedule unless a project asks. The server
# checks every 60 seconds whether this interval has elapsed since this
# project's last pass, so the interval is honoured across restarts.
#
# A single table, not a list. `[[auto_improve.scheduler]]` would declare an
# array of tables and the schedule would be silently ignored.
[auto_improve.scheduler]
enabled = false
interval_minutes = 60
