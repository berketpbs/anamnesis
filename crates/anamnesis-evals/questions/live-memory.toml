# Questions asked of this project's own memory.
#
# The four built-in suites carry their own small corpora — 10 to 22 invented
# pages, written so that a specific retrieval failure has somewhere to happen.
# They answer "does the ranker work". They cannot answer "does *our* memory
# answer *our* questions", because the corpus they score is not the one anybody
# uses.
#
# This file carries no pages. It is asked of a snapshot of real memory:
#
#     anamnesis eval --suite crates/anamnesis-evals/questions/live-memory.toml \
#                    --pages-from <data dir or backup> --scope default/anamnesis
#
# Every question here is one somebody could plausibly type at this project, and
# every `relevant` page is one that actually answers it — checked by reading
# the page, not by running retrieval and writing down what came back. A suite
# built from what retrieval already finds measures nothing.
#
# Two rules kept while writing it:
#
#   - Questions are phrased the way the asker would phrase them, not the way
#     the page is written. Where those differ the case is a `paraphrase`, and
#     several of them are expected to fail. A suite that only asks what the
#     corpus already says is a suite that cannot go down.
#   - Turkish and English questions both appear, because this memory is written
#     in both and people ask in both. Cross-language cases are marked in their
#     notes: a Turkish page reached by an English question has no route through
#     a lexical stream, and that is a finding rather than a bug to hide.

name = "live-memory"
description = "This project's real pages, asked the questions its own people ask"

# Same as the built-in suites: what `memory_query` returns when not told
# otherwise.
limit = 5

categories = ["keyword", "natural", "paraphrase", "symptom", "temporal"]

# What the first run said, 2026-09-21, over 112 pages and 36 questions:
#
#   Hit@1 0.611   MRR 0.714   NDCG@5 0.745   Recall 0.833
#
#   keyword      13   0.846   0.923   0.943   1.000
#   natural       9   0.556   0.667   0.696   0.778
#   paraphrase    5   0.000   0.100   0.126   0.200
#   symptom       8   0.625   0.775   0.831   1.000
#   temporal      1   1.000   1.000   1.000   1.000
#
# Five of the six misses ask in one language of a page in the other, and read
# first as a language problem. Paired probes — one page asked twice, one thing
# changed — say it is **synonymy**: another word for the same thing misses
# inside one language as surely as across two, while a Turkish suffix only
# costs ranks. Cross-language is the extreme of that failure, not a separate
# one. `paraphrase` scoring 0.000 at rank one is the same fact stated by
# category. The probes are in docs/measurements/2026-09-21-live-memory-retrieval.md.
#
# Measured, then rounded down — a floor, not a target. A change that pushes
# these up should raise them; one that pushes them down has to say so in the
# diff.
[thresholds]
min_hit1 = 0.61
min_mrr = 0.71
min_ndcg = 0.74
min_recall = 0.83

# ---------------------------------------------------------------------------
# The continuity marker. The page a whole evening was spent on, and the one
# case set where the lexical limit was already measured by hand on 2026-09-21.
# ---------------------------------------------------------------------------

[[case]]
query = "KIRLANGIC-47"
category = "keyword"
relevant = ["decisions/codex-sureklilik-testi-dogrulama-isareti.md"]
note = "The marker itself, declared as an entity. If this ever misses, name lookup is broken outright."

[[case]]
query = "Codex süreklilik testi doğrulama işareti neydi"
category = "natural"
relevant = ["decisions/codex-sureklilik-testi-dogrulama-isareti.md"]
note = "Asked in the page's own words, with diacritics the ASCII page does not carry. Folding is the only thing between the two."

[[case]]
query = "hafizanin aktarildigini kanitlamak icin sectigimiz gizli kelime neydi"
category = "paraphrase"
relevant = ["decisions/codex-sureklilik-testi-dogrulama-isareti.md"]
note = "Measured as a miss on 2026-09-21. The page says dogrulama isareti; the question says gizli kelime. Kept because the fix has to show up here."

[[case]]
query = "what code word did we agree on to prove memory carried across agents"
category = "paraphrase"
relevant = ["decisions/codex-sureklilik-testi-dogrulama-isareti.md"]
note = "Cross-language against a Turkish page. Expected to miss through every lexical route; it is here to measure the gap, not to be passed."

