name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and when something does
  # panic in CI the run is usually not reproducible locally.
  RUST_BACKTRACE: 1

concurrency:
  # A second push to the same branch makes the first run's answer worthless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every check runs even when an earlier one fails: knowing about the
      # clippy lint *and* the failing test in one round beats finding them
      # one push at a time.
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --all -- --check
          - name: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - name: test
            command: cargo test --workspace
          # A doc warning fails nothing and the page still renders, which is
          # how five of them accumulated unnoticed: two links to items too
          # private for a reader to follow, two rustdoc refused to guess at,
          # and a `<stamp>` placeholder it read as an HTML tag and dropped —
          # from a line that is also `--help` text, so the default path a
          # user was shown had a hole in it. Warnings are errors here for the
          # same reason they are for clippy.
          - name: docs
            command: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; installing the components here
      # rather than a version keeps the two from disagreeing.
      - name: Install toolchain components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Otherwise all four jobs share one cache key and race to write it.
          key: ${{ matrix.name }}

      - run: ${{ matrix.command }}

  # Windows shells write UTF-8 with a byte order mark by default, and this
  # project is developed on Windows. A BOM is invisible in an editor and
  # breaks things that read the first bytes literally: a shebang stops being
  # a shebang, `docker build` sees an unknown instruction, and the cache
  # action gives up on parsing the manifest. Cheaper to catch here than to
  # rediscover each time.
  bom:
    name: no byte order marks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files for a leading BOM
        run: |
          offenders=$(git ls-files -z | xargs -0 -I{} sh -c \
            'head -c 3 "{}" 2>/dev/null | grep -q "$(printf "\357\273\277")" && echo "{}"' || true)
          if [ -n "$offenders" ]; then
            echo "These files start with a UTF-8 byte order mark:"
            echo "$offenders"
            echo
            echo "Rewrite them without one. In PowerShell, Set-Content -Encoding utf8"
            echo "still writes a BOM; use [System.IO.File]::WriteAllText instead."
            exit 1
          fi

  # The image and the compose file have been in the tree since the first weeks
  # and nothing has ever built them: a claim about running anamnesis in a
  # container that nobody had checked. Building is only half of it — an image
  # that builds and does not start is the same broken promise — so this runs
  # the thing and asks it for `/health`, the one route that answers without a
  # token. Two failures this would have caught are already in the history: a
  # byte order mark ahead of `FROM`, and an entrypoint script the image never
  # referenced.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anamnesis:ci
          # A release build of this workspace compiles a tensor library. Without
          # a layer cache every run pays for that from scratch, and a check
          # people wait ten minutes for is a check people start skipping.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The binary in the image runs
        run: docker run --rm anamnesis:ci anamnesis --version

      - name: The server starts and answers
        run: |
          docker run -d --name anamnesis-ci -p 8080:8080 anamnesis:ci
          answered=no
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              answered=yes
              break
            fi
            sleep 2
          done
          # Printed either way: when it did not answer this is the only
          # evidence of why, and when it did the banner says what the
          # container decided about auth, consolidation, and embedding.
          docker logs anamnesis-ci
          [ "$answered" = yes ]

      # SIGTERM is what `docker stop`, systemd, and a supervisor all send, and
      # it is the path nobody takes by hand — Ctrl-C in a terminal is the one
      # people try. A container is the only place in this project's CI where
      # the unattended stop can actually be exercised.
      #
      # What is asserted is that the process left, not that it said it was
      # leaving. The hang this step exists to catch happened *after* the last
      # line was logged: the server announced it had stopped and then parked on
      # a blocking task that never returned. `docker stop` covered for it —
      # SIGKILL once the timeout ran out, exit code 0 from `docker stop`
      # itself, and a green step. So the container's own exit code is the
      # assertion, and how long it took is the second one, because a stop that
      # finishes at nineteen seconds is the same hang arriving just before the
      # axe.
      - name: The server stops when it is asked to
        run: |
          started=$(date +%s)
          docker stop --timeout 20 anamnesis-ci
          elapsed=$(( $(date +%s) - started ))
          code=$(docker inspect -f '{{.State.ExitCode}}' anamnesis-ci)

          # Printed either way: on a failure this is the whole diagnosis, and
          # on a pass it is the number to compare against when it changes.
          echo "stopped after ${elapsed}s, exit code ${code}"
          docker logs anamnesis-ci 2>&1 | tail -5

          if [ "$code" != 0 ]; then
            echo "::error::the container did not stop on its own: exit ${code} (137 is SIGKILL, which is \`docker stop\` giving up and killing it)"
            exit 1
          fi

          # Ten seconds is half the SIGKILL deadline above, so that "it exited"
          # and "it was killed just in time" cannot come back as the same
          # measurement. There is nothing for this container to wait for: the
          # grace period covers summaries still being written, and no session
          # was ever opened against it.
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::the container took ${elapsed}s to stop with nothing in flight; it should be immediate"
            exit 1
          fi

          # It exited on its own and it exited quickly. This last line says the
          # shutdown path is what it left through, rather than some other exit
          # that also happens to be quick and zero.
          docker logs anamnesis-ci 2>&1 | grep -q "anamnesis stopped"

      - name: Stop it
        if: always()
        run: docker rm -f anamnesis-ci

      # Not run — compose brings up a stack this job has no reason to hold
      # open — but parsed, which catches a profile naming a build context or a
      # file that is not there.
      - name: The compose file resolves
        run: docker compose config --quiet

  # The install scripts name archives the release workflow produces, and the two
  # can drift apart without either file changing in a way that looks wrong. So
  # the scripts in this checkout are run against the latest published release,
  # on each system they claim, the way a reader would run them: piped into a
  # shell rather than executed as a file. Twice, because the second run is the
  # one that replaces an existing binary, which is the path an upgrade takes.
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Lint the POSIX script
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Install, then install over it
        if: runner.os != 'Windows'
        env:
          ANAMNESIS_INSTALL_DIR: ${{ runner.temp }}/anamnesis-bin
        run: |
          sh < install.sh
          sh < install.sh
          "$ANAMNESIS_INSTALL_DIR/anamnesis" --version

      - name: Install, then install over it
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, not pwsh: it is what `irm | iex` runs in on a
        # machine nobody has set up, and it is the one that reads a script in
        # the local code page.
        shell: powershell
        env:
          ANAMNESIS_INSTALL_DIR: ${{ runner.temp }}\anamnesis-bin
          ANAMNESIS_NO_PATH: "1"
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:ANAMNESIS_INSTALL_DIR\anamnesis.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The manifests in HomebrewFormula/ and bucket/ are checked the way the
  # install scripts are: by the package manager a reader would use, installing
  # from this checkout as a tap or a bucket. A formula that parses and names a
  # hash nobody published is still a formula that fails on somebody's machine.
  packages:
    name: packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # The files are rendered, not written: what is committed has to be what
      # render.sh makes of the release they name, or the next release's render
      # would quietly undo a hand edit.
      - name: The manifests are what render.sh writes
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shellcheck packaging/render.sh
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' HomebrewFormula/anamnesis.rb)
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          sh packaging/render.sh "v$version" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/rendered"
          diff -u "$RUNNER_TEMP/rendered/HomebrewFormula/anamnesis.rb" HomebrewFormula/anamnesis.rb
          diff -u "$RUNNER_TEMP/rendered/bucket/anamnesis.json" bucket/anamnesis.json

      - name: Install from the tap
        if: runner.os != 'Windows'
        run: |
          if ! command -v brew > /dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap berketpbs/anamnesis "$GITHUB_WORKSPACE"
          brew install berketpbs/anamnesis/anamnesis
          brew test berketpbs/anamnesis/anamnesis
          anamnesis --version
          # The path a hook would be wired to. Printed rather than asserted
          # until the release this formula names carries the fix that keeps
          # it at brew's link instead of the versioned Cellar directory.
          repo=$(mktemp -d) && cd "$repo" && git init -q
          anamnesis install-hooks | grep -m1 'hook --agent'

      - name: Install from the bucket
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add anamnesis "$env:GITHUB_WORKSPACE"
          scoop install anamnesis/anamnesis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          anamnesis --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # From the checkout's metadata, for the version the checkout names. A
      # release PR names a version with no archives yet, and says so.
      - name: Install with cargo binstall
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::v$version is not released yet; nothing for binstall to fetch"
            exit 0
          fi
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          # Outside the checkout, so rust-toolchain.toml does not install a
          # toolchain for a command that compiles nothing.
          cd "$RUNNER_TEMP"
          cargo binstall --no-confirm --disable-strategies compile \
            --manifest-path "$GITHUB_WORKSPACE/crates/anamnesis-cli/Cargo.toml" \
            --install-path "$RUNNER_TEMP/binstall" anamnesis-cli
          "$RUNNER_TEMP/binstall/anamnesis" --version

  # The build every check above implies, run once on the platform the project
  # is actually developed on. Windows is where the paths, the MSVC linker, and
  # the PowerShell BOM handling differ, so a green Linux run is not evidence
  # the thing works there.
  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo test --workspace
