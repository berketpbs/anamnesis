[scope]
workspace = "default"
project = "anamnesis"

[capture]
# ignore_paths configuration for excluding files from memory capture
# Patterns matching recognized file-tool events before they reach spool

[slots]
# Optional per-user memory slots for shared servers
per_user = false

[auto_improve]
# Automatic learning proposals from completed sessions
require_approval = true
enabled = true

[[auto_improve.scheduler]]
# Schedule configuration for auto-improvement runs
interval_minutes = 60
enabled = true
