# Twenty-eight sessions on one small repository, run once with memory and once
# without, in the same order and with the same prompts.
#
# kind = "plant"      the session is told, or finds out, something the
#                     repository does not say
# kind = "distractor" unrelated work, so that what was planted is not simply
#                     the last thing memory holds
# kind = "probe"      the session needs something planted earlier; its check
#                     is the measurement
#
# `plants` names the probe a planting session feeds, and `needs` the session a
# probe depends on, so a report can tell a probe that failed from a probe whose
# knowledge was never planted.
#
# `knowledge` is what that probe needs from the planting session, as a page
# would say it: each inner list is one fact, kept when any of its patterns
# matches a line of any page the session left (case aside). They were written
# against the pages of the three complete runs of 2026-09-17 and -18 after
# reading them, not by matching and keeping whatever matched. Read that way,
# the two runs written by gemini-3.5-flash kept all five and the one written
# by qwen2.5:7b kept one — S03's, and that one garbled.
#
# S13-S17's patterns have not been read off any page yet, since no run has
# planted them. They are written from what the prompts say, and are to be
# checked against the first run's pages the way S01-S05's were. So are S23's.
#
# A session is one `prompt`, or a conversation of `turns` held in one session,
# each sent once the agent has answered the one before. `noise` names what a
# planting session is told only in passing, which its pages should not keep
# as a note of its own. `retires` names the planting session whose rule this
# one replaces, so a probe that needs the replacement can fail in a third way:
# by applying the rule that was retired.

name = "ledger"
description = "Planted knowledge on a small Python bookkeeping library"

[[session]]
id = "S01"
kind = "plant"
plants = "S12"
check = "suite_passes"
# How to run the suite without it hanging: through tools/check.py, or with the
# variable it sets. Both gemini pages named the variable and neither the script.
knowledge = [['LEDGER_FIXTURES', 'tools/check\.py']]
prompt = """
The test suite is failing. Run the tests, find out why, and fix the code so \
every test passes. Don't change the tests.
"""

[[session]]
id = "S02"
kind = "plant"
plants = "S08"
check = "created_at_imported"
knowledge = [['amounts?\b[^\n]{0,120}\blog', '\blog\w*[^\n]{0,120}\b(amounts?|financial)']]
prompt = """
Add an optional `created_at` field to `Entry`, holding a Unix timestamp in \
seconds, and read it from a `created_at` column in the CSV import when the \
column is present.

One rule for this project, please keep it in mind for later work too: amounts \
must never be written to logs, not even at debug level. Our logs are shipped \
to a third-party service and amounts count as customer financial data.
"""

[[session]]
id = "S03"
kind = "plant"
plants = "S09"
check = "chf_rate"
# The generator is the rule: a page that says to run it says the file is not
# edited by hand, and the qwen page that also called rates.toml overwritten
# still said that much.
knowledge = [['gen_rates\.py']]
prompt = """
Add CHF to the supported currencies with a rate of 1.12.

Background you should know: `ledger/generated_rates.py` is generated from \
`rates.toml` by `python tools/gen_rates.py`. Nobody edits it by hand; the \
release build regenerates it, so a manual edit silently disappears.
"""

[[session]]
id = "S04"
kind = "plant"
plants = "S10"
check = "import_limit"
# What went wrong, not only that something did: the qwen page said the session
# avoided "the issue of caching rows as seen last month", and the probe that
# read it built a cache keyed on the path and served the stale rows.
knowledge = [['lru_cache', 'cach\w*[^\n]{0,200}\bstale', '\bstale[^\n]{0,200}cach']]
prompt = """
Add a `--limit N` option to the `import` command that stops after N rows.

For context: imports are slow on big files, and last month someone wrapped \
`parse_row` in an `lru_cache` to speed them up. It served stale rows when a \
file was edited and imported again, and we had to revert it. Don't \
reintroduce caching of import results.
"""

[[session]]
id = "S05"
kind = "plant"
plants = "S11"
check = "version_command"
knowledge = [['ledger-stg-02'], ['ENV=staging']]
prompt = """
Add a `version` command to the CLI that prints `ledger.__version__`.

Also, for your information: we deploy with `make deploy ENV=staging` from the \
ops repository, and the staging host is `ledger-stg-02`.
"""

[[session]]
id = "S06"
kind = "distractor"
check = "balance_json"
prompt = """
Add a `--json` flag to the `balance` command that prints the balances as a \
JSON object mapping each account to its formatted amount string.
"""

[[session]]
id = "S07"
kind = "distractor"
check = "memo_renamed"
prompt = """
Rename the `memo` field of `Entry` to `description` everywhere. The CSV \
importer should accept either a `memo` or a `description` column.
"""

[[session]]
id = "S08"
kind = "probe"
needs = "S02"
check = "logging_without_amounts"
prompt = """
Imports sometimes fail on malformed rows and we can't tell which row broke. \
Add logging to the importer so failures can be debugged: log each row as it \
is parsed at debug level, and log a warning with the details when a row \
cannot be parsed, then skip that row.
"""

[[session]]
id = "S09"
kind = "probe"
needs = "S03"
check = "rates_source_updated"
prompt = """
The EUR rate is out of date; it should be 1.09. Please fix it.
"""

[[session]]
id = "S10"
kind = "probe"
needs = "S04"
check = "repeated_import_not_stale"
prompt = """
Our batch job imports the same CSV file several times in a row, and it is \
slow. Make repeated imports of the same file faster.
"""

[[session]]
id = "S11"
kind = "probe"
needs = "S05"
check = "deploy_note"
prompt = """
Write a short DEPLOY.md explaining how to deploy this project to staging: \
which command to run and which host it goes to.
"""

[[session]]
id = "S12"
kind = "probe"
needs = "S01"
# Both arms can find tools/check.py by looking; what memory can change is how
# long that takes. Reported by turns and cost as well as by its check.
measure = "effort"
check = "suite_passes_and_mixed_currency_raises"
prompt = """
Adding two `Money` values in different currencies should raise a \
`ValueError` instead of silently mixing them. Implement that, add a test for \
it, and make sure the full test suite passes.
"""

# The second five. Each planting session is an ordinary task during which the
# person mentions, in passing and for later, something no file in the
# repository says. Unlike S09 and S12, whose knowledge an agent can find by
# looking, a control arm has no way to these but a guess. S08-S12 run between
# the first plants and these, and S13-S17 between these and their probes.

[[session]]
id = "S13"
kind = "plant"
plants = "S18"
check = "money_subtraction"
knowledge = [['CHF[^\n]{0,160}(0\.05|rappen|nearest (five|5)\b)', '(0\.05|rappen|nearest (five|5)\b)[^\n]{0,160}CHF']]
prompt = """
Add subtraction to `Money`, so that `Money(500) - Money(200)` is \
`Money(300)`.

Not needed for this task, but keep it in mind for later work: our Swiss \
auditors require every CHF total we print to be rounded to the nearest 0.05 \
CHF, that is to five rappen. Other currencies are rounded to the cent as \
usual.
"""

[[session]]
id = "S14"
kind = "plant"
plants = "S19"
check = "count_command"
knowledge = [['<?(file|path)>?:<?line>?', 'line numbers?[^\n]{0,160}(errors?|messages?)', '(errors?|messages?)[^\n]{0,160}line numbers?']]
prompt = """
Add a `count` command to the CLI that prints how many entries a CSV file \
holds.

One convention for this project, please keep it in mind for later work too: \
an error a user sees is printed to stderr as `<file>:<line>: <message>`, \
with the line number an editor would show for that row, and the command \
exits with status 1. Never a traceback.
"""

[[session]]
id = "S15"
kind = "plant"
plants = "S20"
check = "accounts_command"
knowledge = [['ledger/formats', 'export\.py[^\n]{0,200}(deprecat|going away|on its way out|leave|as it is|untouched|do not (edit|change|touch)|don.t (edit|change|touch))']]
prompt = """
Add an `accounts` command that prints each account name that appears in a \
CSV file, once each, sorted.

Something to know for later: `ledger/export.py` is on its way out. Finance's \
spreadsheet still reads what `export-csv` writes, so leave that file exactly \
as it is until they move, and put any new output format in a module of its \
own under `ledger/formats/`.
"""

[[session]]
id = "S16"
kind = "plant"
plants = "S21"
check = "currencies_command"
knowledge = [['fx\.internal\.example'], ['X-Ledger-Team']]
prompt = """
Add a `currencies` command that prints the currency codes the ledger has \
rates for, one per line, sorted.

For later: the rates themselves come from our internal rates service at \
`https://fx.internal.example/v2/rates`, which only answers requests that \
carry the header `X-Ledger-Team: finance`. There is nothing to do with that \
now.
"""

[[session]]
id = "S17"
kind = "plant"
plants = "S22"
check = "import_quiet"
knowledge = [['dana-fin']]
prompt = """
Add a `--quiet` flag to the `import` command that leaves out the \
`imported N entries` line.

A rule to keep in mind for later work: any change to an exchange rate needs \
sign-off from finance, so the pull request for it has to ask `@dana-fin` to \
sign off in its description.
"""

[[session]]
id = "S18"
kind = "probe"
needs = "S13"
check = "total_chf_rounded"
# "The entries in that currency" read, on 2026-09-22, as every entry converted
# into it: the memory arm printed 14.17 CHF for rows of CHF and USD, and the
# probe measured how the prompt was read rather than what was remembered. So
# it says which entries count.
prompt = """
Add a `total` command: `python -m ledger.cli total FILE --currency CODE` \
prints the sum of the file's entries whose currency is CODE, formatted the \
way `Money.format()` formats an amount. Entries in other currencies are left \
out, not converted.
"""

[[session]]
id = "S19"
kind = "probe"
needs = "S14"
check = "import_error_names_file_line"
# Not a plain `import`: S08 asked for a row that cannot be parsed to be logged
# and skipped, so a bad file imports without an error until this asks for one.
prompt = """
Add a `--strict` option to the `import` command: with it, a row that cannot \
be parsed is an error that stops the import, and the command fails.
"""

[[session]]
id = "S20"
kind = "probe"
needs = "S15"
check = "jsonl_export_leaves_export_py"
prompt = """
Add an `export-jsonl` command that writes each account's balance as JSON \
Lines, one object per line with `account` and `balance` keys, the way \
`export-csv` writes CSV.
"""

[[session]]
id = "S21"
kind = "probe"
needs = "S16"
check = "fetch_rates_script"
prompt = """
Write `tools/fetch_rates.py`, a script that fetches today's exchange rates \
and writes them into `rates.toml`.
"""

[[session]]
id = "S22"
kind = "probe"
needs = "S17"
check = "rate_change_signed_off"
prompt = """
GBP is 1.29 now. Update the rate, and write the description for the pull \
request in `PR.md`.
"""

# A decision taken in conversation. The first twenty-two are each told
# something in one prompt; S23 is how a decision is usually made — the agent
# is asked for options, the person picks one and says what was dropped, and
# the session goes on to other work. Nothing is built for it and no file says
# it. The third turn also carries a word said only to check the session is
# being recorded: `noise` is what its pages should not keep as a note.
[[session]]
id = "S23"
kind = "plant"
plants = "S25"
check = "largest_command"
knowledge = [['settings\.py'], ['LEDGER_(<|\{|\*|NAME|\[)', 'environment variables?[^\n]{0,160}LEDGER_(?!FIXTURES)', 'LEDGER_(?!FIXTURES)[^\n]{0,160}environment']]
noise = ['ORCHID-19']
# A rejected option must not survive as a current decision. This expression is
# deliberately about the affirmative title, not any mention of ledger.toml:
# the chosen decision may explain that it was considered and dropped.
rejected_decisions = ['(?i)^settings (live|are stored) in ledger\.toml']
turns = [
"""
Add a `largest` command: `python -m ledger.cli largest FILE -n N` prints the \
N entries with the largest amounts in USD, largest first, one per line as \
the account and the amount.
""",
"""
A separate question, with nothing to build yet: we will soon need a handful \
of settings — the default currency, where the rates file lives, maybe a log \
level. How would you make this project configurable? A short list of the \
options is enough.
""",
"""
Let's settle it. Settings are environment variables named `LEDGER_<NAME>`, \
all read in one module, `ledger/settings.py`, and nothing else in `ledger/` \
reads the environment. No config file — we talked about a `ledger.toml` and \
dropped it, because production runs in containers where ops set environment \
variables — and no command-line flags for settings either. There is nothing \
to build for this now, so leave the files as they are. And a quick check that \
this session is being recorded: today's check word is ORCHID-19. Nothing to \
do with it.
""",
"""
One more small thing on `largest`: make `-n` default to 5.
""",
]

[[session]]
id = "S24"
kind = "distractor"
check = "negative_command"
prompt = """
Add a `negative` command that prints the entries whose amount is below zero, \
one per line as the account and the amount.
"""

[[session]]
id = "S25"
kind = "probe"
needs = "S23"
check = "default_currency_setting"
# One session after the plant, not straight after it: S24's handoff is the one
# waiting, so a pass has to come from what S23 left in memory rather than from
# the note the last session hands the next.
prompt = """
Rows with an empty currency column are read as USD. Make that default \
configurable, so that a deployment in Europe can have them read as EUR \
instead.
"""

# A rule retired. S17 planted that `@dana-fin` signs off rate changes and S22
# used it, so by now memory holds the rule, a page where it was applied, and
# the repository a PR.md that asks `@dana-fin`. S26 replaces it in passing, S27 is
# unrelated so that S28 is handed S27's note rather than S26's, and S28 needs
# the replacement. Asking `@dana-fin` there is not a miss: it is the retired
# rule applied, which the report counts apart and against memory.
[[session]]
id = "S26"
kind = "plant"
plants = "S28"
retires = "S17"
check = "rates_command"
knowledge = [['omar-fin']]
prompt = """
Add a `rates` command: `python -m ledger.cli rates` prints each currency in \
`rates.toml` and its rate to USD, one per line, sorted by currency code.

Also, a change to a rule from earlier: Dana has moved to the treasury team, so \
from now on a change to an exchange rate needs sign-off from `@omar-fin` \
instead. Pull requests for rate changes ask `@omar-fin`, not `@dana-fin`.
"""

[[session]]
id = "S27"
kind = "distractor"
check = "head_command"
prompt = """
Add a `head` command: `python -m ledger.cli head FILE -n N` prints the first \
N entries of the file in the order they appear, one per line as the account \
and the amount. `-n` defaults to 3.
"""

[[session]]
id = "S28"
kind = "probe"
needs = "S26"
check = "rate_change_signed_off_after_handover"
prompt = """
EUR is 1.11 now. Update the rate, and write the description for the pull \
request in `PR.md`.
"""
