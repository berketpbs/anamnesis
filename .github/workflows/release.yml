name: release

# A tag publishes; a manual run only builds. The second is not a convenience —
# it is how this workflow gets tested without inventing a version, which is
# the reason release workflows are usually first exercised on the day they
# matter most.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: a release that is
      # missing macOS is a release somebody can still take Linux from, and
      # knowing which target broke beats knowing that one did.
      fail-fast: false
      matrix:
        include:
          # Not ubuntu-latest. A binary linked against glibc asks for the
          # newest symbol versions of the machine it was built on, and the
          # loader refuses to start it anywhere older: v1.1.0, built on 24.04,
          # needed glibc 2.39 and could not run on Ubuntu 22.04, Debian 12 or
          # RHEL 9. Building on the oldest supported runner is what sets the
          # floor, and the check below holds it there.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            native: true
          # Cross-compiled on the Apple silicon runner rather than built on an
          # Intel one. `macos-13` is the scarcest runner GitHub has left — the
          # first rehearsal of this workflow had it queued for over an hour
          # while the other three finished in minutes — and a release that
          # waits on a runner class being retired is a release that eventually
          # does not happen. Apple's toolchain targets both architectures, so
          # this costs nothing but the check below.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            native: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            native: true

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version, the same way the CI workflow
      # leaves it alone; only the target has to be added.
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The C runtime linked in rather than borrowed from the machine. Without
      # it the Windows binary imports VCRUNTIME140.dll, which Windows does not
      # ship: v1.1.0 started on every machine with a Visual C++ Redistributable
      # installed, including the one it was written on and the runner that
      # checked it, and nowhere else. Every C dependency here is compiled from
      # source by the cc crate, which follows this flag, so nothing is left
      # linked against the other runtime.
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *-windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked -p anamnesis-cli --target ${{ matrix.target }}

      # The version comes from the tag when there is one, and from the
      # manifest otherwise, so a dispatched build produces the same names a
      # tagged one would rather than a special case nobody ever looks at.
      - name: Name the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            # From the workspace manifest, with nothing but grep and sed: the
            # three runners agree on those, and they do not agree on which
            # Python is on PATH inside bash.
            version="v$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="anamnesis-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          staged="dist/$name"
          mkdir -p "$staged"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/anamnesis.exe" "$staged/"
          else
            cp "target/${{ matrix.target }}/release/anamnesis" "$staged/"
          fi
          # What somebody needs beside the binary to know what they have.
          cp README.md LICENSE CHANGELOG.md "$staged/"

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi

          # A checksum beside every archive, computed where the archive was
          # made. A release nobody can verify is a release nobody should run.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Check it runs
        shell: bash
        run: |
          # A release binary that does not start is the one failure a release
          # workflow must never let through — where the runner can start it.
          # The Intel macOS build is the exception and it is named rather than
          # skipped quietly: it is cross-compiled on an Apple silicon runner,
          # which cannot be relied on to execute it. What stands behind that
          # one is the compiler and the linker agreeing, and nothing else.
          if [[ "${{ matrix.native }}" != "true" ]]; then
            echo "cross-compiled for ${{ matrix.target }}; not executed here"
            file "target/${{ matrix.target }}/release/anamnesis"
            exit 0
          fi
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            "target/${{ matrix.target }}/release/anamnesis.exe" --version
          else
            "target/${{ matrix.target }}/release/anamnesis" --version
          fi

      # Starting on the runner says little about starting anywhere else: the
      # runner has the newest glibc and a Visual C++ Redistributable, which is
      # exactly why v1.1.0 passed the step above. So what the binary asks of
      # the machine is read out of the binary itself.
      - name: Check what it needs from the machine
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-linux-gnu)
              # RHEL 9's glibc, the oldest of the three this build is for
              # (Ubuntu 22.04 has 2.35, Debian 12 2.36). Building on 22.04
              # allows symbols up to 2.35, so it is this line, not the
              # runner, that keeps RHEL 9; v1.1.1 measured 2.34.
              floor=2.34
              binary="target/${{ matrix.target }}/release/anamnesis"
              needed=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -1)
              echo "needs glibc $needed (floor $floor)"
              if [[ "$(printf '%s\n%s\n' "$needed" "$floor" | sort -V | tail -1)" != "$floor" ]]; then
                echo "::error::the Linux binary needs glibc $needed, newer than $floor; it will not start on older distributions"
                exit 1
              fi
              ;;
            *-windows-msvc)
              binary="target/${{ matrix.target }}/release/anamnesis.exe"
              if grep -aqiE 'vcruntime140(_1)?\.dll|msvcp140\.dll' "$binary"; then
                echo "::error::the Windows binary imports the Visual C++ runtime DLLs; it will not start without the Redistributable"
                exit 1
              fi
              echo "links the C runtime statically"
              ;;
            *)
              echo "nothing to read for ${{ matrix.target }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: anamnesis-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  # The image, built once per architecture on a runner of that architecture.
  #
  # Not under QEMU: this workspace compiles a tensor library, and emulating
  # arm64 to do it turns a seven-minute job into most of an hour. Public
  # repositories get arm64 runners, so the cross-architecture problem is solved
  # by not having one.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # A dispatched run builds both architectures and pushes neither, the
      # same rehearsal the binaries get.
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # By digest, with the manifest list assembled afterwards: two jobs
          # pushing the same tag would leave whichever finished last, and the
          # other architecture unreachable.
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag pointing at both architectures. Docker picks the right one; nobody
  # has to know which they are on.
  manifest:
    name: manifest
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point the tags at both architectures
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cd digests
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:latest" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"

  publish:
    name: publish
    needs: build
    # Only a tag publishes. A dispatched run has built everything above and
    # stops here, which is what makes it safe to use as a rehearsal.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the release archives. This run also carries image digests and a
      # build record per image job, and asking for all of them made publishing
      # depend on artifacts it never opens: v1.0.0 built four binaries and two
      # images, then failed here because two buildx build records would not
      # come down.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: anamnesis-*
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "Binaries for Linux, macOS (Intel and Apple silicon) and Windows. Verify with SHA256SUMS. What changed is in CHANGELOG.md." \
            dist/*

  # The Homebrew formula and the Scoop manifest name one release's archives by
  # hash, so every release leaves them one behind until they are rendered
  # again. This renders them from the checksums the release is built with, on
  # a dispatched run too — the rendering is most of what can break, and a
  # rehearsal that skipped it would say nothing about it. Only a tag pushes the
  # result, as a branch for a pull request rather than a commit to main: the
  # manifests change what `brew upgrade` installs for everybody, and that goes
  # through the same review as anything else that does.
  manifests:
    name: package manifests
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On a tag, main: the branch this pushes is for a pull request into it.
      # On a dispatched run, the branch being rehearsed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: anamnesis-*
          merge-multiple: true

      - name: Render
        id: render
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="v$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          (cd dist && cat *.sha256 > SHA256SUMS)
          sh packaging/render.sh "$version" dist/SHA256SUMS
          git diff --stat
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push them for a pull request
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${{ steps.render.outputs.version }}"
          branch="packaging/$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add HomebrewFormula bucket
          git commit -m "packaging: Homebrew and Scoop manifests for $version"
          git push origin "$branch"
          echo "::notice::manifests for $version are on $branch; open a pull request from it to main"
