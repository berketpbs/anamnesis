[workspace]
resolver = "3"
members = [
    "crates/anamnesis-core",
    "crates/anamnesis-store",
    "crates/anamnesis-wiki",
    "crates/anamnesis-mcp",
    "crates/anamnesis-hooks",
    "crates/anamnesis-llm",
    "crates/anamnesis-consolidate",
    "crates/anamnesis-web",
    "crates/anamnesis-cli",
    "evals",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/berketpbs/anamnesis"
authors = ["Berke Topbas <berketopbas126@gmail.com>"]

[workspace.dependencies]
# Inter-crate dependencies.
anamnesis-core = { path = "crates/anamnesis-core", version = "1.0.0" }
anamnesis-store = { path = "crates/anamnesis-store", version = "1.0.0" }
anamnesis-wiki = { path = "crates/anamnesis-wiki", version = "1.0.0" }
anamnesis-mcp = { path = "crates/anamnesis-mcp", version = "1.0.0" }
anamnesis-hooks = { path = "crates/anamnesis-hooks", version = "1.0.0" }
anamnesis-llm = { path = "crates/anamnesis-llm", version = "1.0.0" }
anamnesis-consolidate = { path = "crates/anamnesis-consolidate", version = "1.0.0" }
anamnesis-web = { path = "crates/anamnesis-web", version = "1.0.0" }
anamnesis-evals = { path = "evals", version = "1.0.0" }

# Error handling.
anyhow = "1"
thiserror = "2"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# Logging / tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Time & IDs.
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

# Config & CLI.
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "5"
toml_edit = "0.22"

# Secrets + constant-time / RNG primitives for bearer-token auth.
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
getrandom = "0.3"
base64 = "0.22"

# Storage.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
refinery = { version = "0.8", features = ["rusqlite"] }
sha2 = "0.10"
parking_lot = "0.12"

# Filesystem watcher + process inspection.
notify = "8"
notify-debouncer-full = "0.6"
sysinfo = "0.32"
fs2 = "0.4"

# Windows NTFS file-index (inode equivalent) for own-write detection.
winapi-util = "0.1"

# MCP server SDK.
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Backup / restore archive format.
tar = "0.4"
flate2 = "1"

# Markdown rendering for the wiki browser. Raw HTML in a page is shown as
# text rather than passed through: pages are written by models and by capture,
# so the body is untrusted input that happens to live on disk.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Text munging / hook payload sanitisation.
regex = "1"

# Capture exclusions: gitignore-style glob matching for `[capture] ignore_paths`.
globset = "0.4"

# Wiki git versioning.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# LLM provider HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-trait = "0.1"

# Local text embeddings (vector-cosine retrieval stream). CPU-only: no CUDA
# feature, so no GPU toolchain is required to build or run anamnesis.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Testing.
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# Dependencies build without debug info, which this project's own crates keep.
# Measured on a clean build: `target/debug/deps` was 3.3 GB of a 4.2 GB tree,
# and almost all of it is debug info for crates nobody steps through — candle,
# tokenizers, rmcp, reqwest, axum, git2. Left alone it is worse than it looks,
# because cargo never collects the artifacts a changed dependency version
# leaves behind: the same tree had grown to 7.2 GB, and to 40 GB before that.
#
# `"*"` reaches dependencies and not workspace members, so stepping through
# this repository's code still works and its frames in a backtrace still carry
# a file and a line. What is given up is inspecting a variable inside a
# dependency, which is not how anything here has ever been debugged. CI gets
# it too: every job saves and restores this tree through `rust-cache`.
[profile.dev.package."*"]
debug = false
